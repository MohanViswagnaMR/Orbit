<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0e1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbit">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/orbit-180.png">
<title>Orbit</title>
<!-- Orbit on a phone: the same team, chats and inbox as the desktop page (index.html), laid out for one thumb.
     Bottom tabs, a pinned message box above the keyboard, big tap targets, and the phone's back gesture. -->
<style>
  :root {
    --bg: #0e1220; --surface: #161b2d; --raised: #1d2338; --line: #262d45; --line-strong: #343c5a;
    --text: #e8ebf6; --muted: #9aa2bf; --faint: #6b7392; --accent: #9a8cff; --on-accent: #16131f;
    --good: #5cbf86; --bad: #ef6d64; --warn: #e8b04b; --me: #2b2a52;
    --top: env(safe-area-inset-top, 0px); --bottom: env(safe-area-inset-bottom, 0px); --kb: 0px;
    --serif: ui-serif, "Iowan Old Style", Georgia, serif; --mono: ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme=dark]) { --bg: #f4f5fa; --surface: #ffffff; --raised: #ffffff; --line: #e3e6f0; --line-strong: #cfd4e4; --text: #151a2c; --muted: #5b6380; --faint: #8a91aa;
      --accent: #6b5ce7; --on-accent: #ffffff; --me: #e8e4ff; color-scheme: light; }
  }
  :root[data-theme=light] { --bg: #f4f5fa; --surface: #ffffff; --raised: #ffffff; --line: #e3e6f0; --line-strong: #cfd4e4; --text: #151a2c; --muted: #5b6380; --faint: #8a91aa;
    --accent: #6b5ce7; --on-accent: #ffffff; --me: #e8e4ff; color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overscroll-behavior: none; }
  body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { touch-action: manipulation; cursor: pointer; }
  a { color: var(--accent); }
  [hidden] { display: none !important; }
  /* motion: a chat you open from a pinned person (or +) rises from the bottom; Chats, Tasks and Projects slide sideways */
  body.rise #app { animation: rise .34s cubic-bezier(.2, .8, .2, 1); }
  @keyframes rise { from { transform: translateY(100%); } }
  #clist.from-right { animation: fromRight .26s cubic-bezier(.2, .8, .2, 1); }
  #clist.from-left { animation: fromLeft .26s cubic-bezier(.2, .8, .2, 1); }
  @keyframes fromRight { from { transform: translateX(40%); opacity: 0; } }
  @keyframes fromLeft { from { transform: translateX(-40%); opacity: 0; } }
  #screen { overflow-x: hidden; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* the frame: top bar, the screen, bottom tabs (all inside the phone's safe area) */
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  .bar { flex: none; display: flex; align-items: center; gap: 4px; min-height: calc(52px + var(--top)); padding: var(--top) 8px 0; background: var(--bg); border-bottom: 1px solid transparent; }
  .bar.lined { border-bottom-color: var(--line); }
  .bar h1 { flex: 1; min-width: 0; margin: 0 8px; font: 600 22px/1.2 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .who { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 4px; border: 0; background: none; text-align: left; }
  .bar .who > span:last-child { display: flex; flex-direction: column; min-width: 0; }
  .bar .who b { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .who small { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ib { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 12px; background: none; color: var(--text); }
  .ib:active { background: var(--raised); }
  .ib svg { width: 24px; height: 24px; }
  #screen { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); padding: 4px 4px var(--bottom); background: color-mix(in srgb, var(--surface) 92%, transparent); border-top: 1px solid var(--line);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .tabs a { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 50px; padding: 6px 0 4px; color: var(--faint); text-decoration: none; font-size: 11px; font-weight: 500; }
  .tabs a svg { width: 24px; height: 24px; }
  .tabs a.on { color: var(--accent); }
  .tabs .badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
  .tabs .badge.live { background: var(--accent); color: var(--on-accent); }
  body.inchat .tabs { display: none; }

  /* lists */
  .search { margin: 4px 16px 8px; display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 40px; border-radius: 12px; background: var(--raised); color: var(--faint); }
  .search input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; font-size: 16px; }
  .pins { display: flex; gap: 12px; overflow-x: auto; padding: 4px 16px 12px; scroll-padding-inline: 16px; scrollbar-width: none; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
  .pins::-webkit-scrollbar { display: none; }
  .pins:empty { display: none; }
  a.pin { color: inherit; text-decoration: none; }
  .pin { flex: none; width: 66px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; border: 0; background: none; scroll-snap-align: start; }
  .pin .ring { position: relative; padding: 2px; border-radius: 50%; border: 2.5px solid transparent; }
  .pin .ring.busy { border-color: var(--accent); }
  .pin .av { width: 56px; height: 56px; font-size: 21px; }
  .pin small { max-width: 66px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; color: var(--text); }
  .pin .need { position: absolute; top: -3px; right: -3px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; border: 2px solid var(--bg); background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; line-height: 16px; text-align: center; }
  .seg { display: flex; gap: 4px; margin: 0 16px 8px; padding: 3px; border-radius: 12px; background: var(--raised); }
  .seg button { flex: 1; height: 34px; border: 0; border-radius: 9px; background: none; color: var(--muted); font-size: 14px; font-weight: 500; }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgb(0 0 0 / .25); }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 68px; padding: 10px 16px; border: 0; background: none; text-align: left; text-decoration: none; color: inherit; }
  .row:active { background: var(--raised); }
  .row .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding-bottom: 10px; margin-bottom: -10px; border-bottom: 1px solid var(--line); }
  .row:last-child .main { border-bottom: 0; }
  .row .top { display: flex; align-items: baseline; gap: 8px; }
  .row .top b { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .top time { flex: none; font-size: 12.5px; color: var(--faint); }
  .row .line { display: flex; align-items: center; gap: 6px; font-size: 14.5px; color: var(--muted); }
  .row .line > span:first-child { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.unread .top b, .row.unread .line > span:first-child { color: var(--text); }
  .dotbadge { flex: none; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  .dotbadge.bad { background: var(--bad); color: #fff; }
  .typing { display: inline-flex; gap: 3px; align-items: center; color: var(--accent); }
  .typing i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .sec { margin: 18px 16px 6px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .empty { margin: 48px 32px; text-align: center; color: var(--muted); font-size: 15px; }
  .empty b { display: block; margin-bottom: 6px; color: var(--text); font-size: 18px; }

  /* avatars */
  .av { flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; overflow: hidden; color: #fff; font-weight: 600; font-size: 18px; object-fit: cover; background: var(--raised); }
  .av.sm { width: 28px; height: 28px; font-size: 12px; }
  .av.md { width: 36px; height: 36px; font-size: 15px; }
  .av.xl { width: 84px; height: 84px; font-size: 32px; }
  .avwrap { position: relative; flex: none; }
  .avwrap .busy { position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2.5px solid var(--bg); }

  /* the + button, in reach of your thumb */
  .fab { position: absolute; right: 16px; bottom: calc(68px + var(--bottom)); width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--accent); color: var(--on-accent);
    display: grid; place-items: center; box-shadow: 0 8px 24px rgb(0 0 0 / .35); z-index: 5; }
  .fab svg { width: 28px; height: 28px; }
  .fab:active { transform: scale(.96); }
  body.inchat .fab { display: none; }

  /* a conversation */
  .msgs { display: flex; flex-direction: column; gap: 4px; padding: 12px 12px 16px; }
  .day { align-self: center; margin: 10px 0 4px; font-size: 12px; color: var(--faint); }
  .me { align-self: flex-end; max-width: 84%; padding: 9px 13px; border-radius: 20px 20px 6px 20px; background: var(--me); white-space: pre-wrap; overflow-wrap: anywhere; }
  .reply { align-self: stretch; display: flex; gap: 8px; margin-top: 8px; }
  .reply .bubble { flex: 1; min-width: 0; }
  .reply .by { font-size: 13px; font-weight: 600; margin: 4px 0 2px; }
  .body { font-size: 16px; line-height: 1.55; overflow-wrap: anywhere; }
  .body p { margin: 0 0 .7em; } .body p:last-child { margin-bottom: 0; }
  .body h1, .body h2, .body h3, .body h4 { margin: .8em 0 .35em; font-size: 1.05em; }
  .body ul, .body ol { margin: .2em 0 .7em; padding-left: 1.3em; }
  .body code { font: .88em var(--mono); padding: 1px 5px; border-radius: 6px; background: var(--raised); }
  .body pre, .body .codeblock pre { margin: 0; padding: 10px 12px; overflow-x: auto; font: 13px/1.5 var(--mono); }
  .body .codeblock { margin: .5em 0 .8em; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
  .body .codehead { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 4px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .body .codehead button { min-height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: var(--accent); font-size: 13px; }
  .body table { display: block; overflow-x: auto; border-collapse: collapse; margin: .5em 0 .8em; font-size: 14px; }
  .body th, .body td { padding: 6px 10px; border: 1px solid var(--line); text-align: left; vertical-align: top; overflow-wrap: normal; word-break: normal; min-width: 4.5em; }
  .body th { white-space: nowrap; }
  .pdot { display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; vertical-align: 1px; }
  .body blockquote { margin: .4em 0; padding-left: 12px; border-left: 3px solid var(--line-strong); color: var(--muted); }
  .body hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
  .meta { font-size: 12px; color: var(--faint); margin-top: 6px; }
  .note { align-self: center; max-width: 92%; margin: 6px 0; padding: 4px 12px; border-radius: 12px; background: var(--raised); color: var(--muted); font-size: 12.5px; text-align: center; }
  .note.bad { color: var(--bad); }
  .card { margin-top: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); font-size: 14.5px; }
  .card .lbl { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 36px; padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: 18px; background: var(--surface); color: var(--text); font-size: 14px; text-decoration: none; }
  .chip span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip svg { flex: none; width: 18px; height: 18px; color: var(--muted); }
  .chip small { flex: none; }
  .chip small { color: var(--faint); }
  .working { display: flex; align-items: center; gap: 8px; margin: 10px 0 0 44px; font-size: 13px; color: var(--muted); }
  .working span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* the bottom of a conversation: requests, questions, then the message box */
  .dock { flex: none; padding: 8px 10px calc(8px + var(--bottom)); padding-bottom: max(calc(8px + var(--bottom)), calc(8px + var(--kb))); background: var(--bg); border-top: 1px solid var(--line); }
  .ask { margin: 0 0 8px; padding: 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line-strong); }
  .ask .q { font-weight: 600; margin: 2px 0 10px; }
  .ask .step { font-size: 12.5px; color: var(--muted); }
  .opts { display: flex; flex-direction: column; gap: 6px; }
  .opt { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 46px; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--bg); text-align: left; }
  .opt.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--bg)); }
  .opt small { display: block; color: var(--muted); font-size: 13px; }
  .opt .tick { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; }
  .opt.on .tick { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
  .ask input { width: 100%; margin-top: 8px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--bg); font-size: 16px; }
  .row2 { display: flex; gap: 8px; margin-top: 10px; }
  .btn { flex: 1; min-height: 46px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 14px; background: var(--surface); font-size: 15px; font-weight: 600; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.danger { color: var(--bad); }
  .btn.good { background: var(--good); border-color: var(--good); color: #fff; }
  .btn:disabled { opacity: .5; }
  .btn:active { filter: brightness(.92); }
  .ok { margin: 0 0 8px; padding: 12px; border-radius: 16px; background: color-mix(in srgb, var(--warn) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); }
  .ok b { display: block; margin-bottom: 4px; }
  .ok .what { font: 13px/1.45 var(--mono); max-height: 4.4em; overflow: hidden; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
  .ap details { margin-top: 6px; font-size: 13.5px; color: var(--muted); }
  .ap details summary { min-height: 36px; display: flex; align-items: center; color: var(--accent); list-style: none; }
  .ap details summary::-webkit-details-marker { display: none; }
  .ap label { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; color: var(--muted); }
  .ap input[type=checkbox] { flex: none; width: 22px; height: 22px; accent-color: var(--accent); }
  .compose { display: flex; align-items: flex-end; gap: 6px; }
  .compose textarea { flex: 1; min-width: 0; min-height: 44px; max-height: 40vh; padding: 10px 14px; border: 1px solid var(--line-strong); border-radius: 22px; background: var(--surface);
    resize: none; outline: none; font-size: 16px; line-height: 1.4; }
  .compose textarea:focus { border-color: color-mix(in srgb, var(--accent) 60%, var(--line-strong)); }
  .send { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
  .send svg { width: 22px; height: 22px; }
  .send:disabled { opacity: .35; }
  .send.stop { background: var(--raised); color: var(--text); border: 1px solid var(--line-strong); }
  .attach { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 8px; }
  .attach .chip { flex: none; max-width: 78%; }
  #dockTop { max-height: 52dvh; overflow-y: auto; overscroll-behavior: contain; } /* the conversation stays in view above a request or a question */
  .attach .chip button { border: 0; background: none; width: 24px; height: 24px; padding: 0; color: var(--muted); }
  .mrow { display: flex; gap: 6px; margin: 0 0 6px 2px; }
  .mchip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 34px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 17px; background: var(--surface); color: var(--muted); font-size: 13.5px; }
  .mchip b { color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mchip svg { flex: none; width: 14px; height: 14px; }
  .mchip.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
  .mchip.on, .mchip.on b { color: var(--accent); }
  .sheet .pick { min-height: 56px; }
  .sheet .pick small { color: var(--muted); font-size: 13px; }
  .sheet .pick svg { color: var(--accent); }
  .hint { margin: 0 0 6px 4px; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hint button { min-height: 32px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 16px; background: var(--surface); font-size: 13px; }
  .hint button.on { border-color: var(--accent); color: var(--accent); }

  /* inbox and live */
  .icard { margin: 8px 12px; padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
  .icard .head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .icard .head > span:not(.tag):not(.typing) { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .icard .head b { font-size: 15px; }
  .icard .head small { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icard .text { font-size: 14.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .icard.ok-card { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
  .icard .what, .sheet .what { font: 13px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 6em; overflow: hidden; padding: 8px 10px; border-radius: 10px; background: var(--bg); }
  .tag { flex: none; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .tag.ok { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .tag.ask { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); }
  .tag.review { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
  .tag.failed, .tag.stopped { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  .tail { margin-top: 8px; font: 12.5px/1.45 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* a sheet that slides up from the bottom */
  .scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .45); z-index: 20; animation: fade .15s; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 86dvh; overflow-y: auto; padding: 8px 0 calc(16px + var(--bottom)); border-radius: 22px 22px 0 0;
    background: var(--surface); box-shadow: 0 -12px 40px rgb(0 0 0 / .35); animation: up .2s ease-out; }
  .sheet .grip { width: 40px; height: 5px; margin: 0 auto 8px; border-radius: 3px; background: var(--line-strong); }
  .sheet h2 { margin: 4px 20px 8px; font: 600 20px var(--serif); }
  .sheet .pad { padding: 0 20px; }
  .sheet .action { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 54px; padding: 0 20px; border: 0; background: none; text-align: left; font-size: 16px; text-decoration: none; color: inherit; }
  .sheet .action:active { background: var(--raised); }
  .sheet .action svg { width: 22px; height: 22px; color: var(--muted); }
  .sheet .action.danger { color: var(--bad); }
  @keyframes up { from { transform: translateY(100%); } }
  @keyframes fade { from { opacity: 0; } }
  .person { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 20px 16px; text-align: center; }
  .person h3 { margin: 6px 0 0; font: 600 22px var(--serif); }

<script>
// ---------- helpers ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
/*ORBIT_MARKDOWN*/
const ICON = {

  clip: '<path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7-7l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l8-8"/>',
  dots: '<circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>', check: '<path d="M5 12l5 5L20 7"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
  desktop: '<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>', gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>', file: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
  done: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>', open: '<path d="M7 17L17 7M9 7h8v8"/>', down: '<path d="M6 9l6 6 6-6"/>',
  archive: '<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/>',
  task: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/>', folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
};
const icon = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const ts = (s) => new Date(String(s).replace(' ', 'T') + 'Z');
const clock = (s) => ts(s).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const short = (s) => { // "14:05" today, "Tue" this week, "9 Oct" before
  const d = ts(s), days = (Date.now() - d) / 864e5;
  return d.toDateString() === new Date().toDateString() ? clock(s) : days < 6 ? d.toLocaleDateString([], { weekday: 'short' }) : d.toLocaleDateString([], { day: 'numeric', month: 'short' });
};
const dayName = (s) => { const d = ts(s), y = new Date(Date.now() - 864e5); return d.toDateString() === new Date().toDateString() ? 'Today' : d.toDateString() === y.toDateString() ? 'Yesterday' : d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' }); };
const since = (ms) => { const s = Math.max(0, Math.round((Date.now() - ms) / 1000)); return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60 ? `${s % 60}s` : ''}`.trim(); };
const plain = (md) => String(md ?? '').replace(/```[\s\S]*?```/g, '[code]').replace(/[*_`#>|]/g, '').replace(/\s+/g, ' ').trim(); // a one-line preview
const shown = new WeakMap();
const setHTML = (el, html) => { if (el && shown.get(el) !== html) { el.innerHTML = html; shown.set(el, html); return true; } };
const buzz = () => navigator.vibrate?.(8); // a tiny tap on Android; iPhones ignore it

// ---------- talking to Orbit ----------
let state = null, misses = 0;
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) location.replace('/'); // signed out: back to sign-in
  if (!r.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}
function toast(text) {
  const t = $('#toast');
  t.textContent = text;
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (t.hidden = true), 3200);
}
const fail = (err) => toast(err.message);

// ---------- what's what ----------
const emp = (id) => state?.employees.find((e) => e.id === id);
const nameOf = (id) => emp(id)?.name ?? 'Former teammate';
const hue = (s) => [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 17);
const av = (e, size = '') => e?.avatar ? `<img class="av ${size}" src="/avatars/${e.id}.svg?v=${e.avatar}" alt="">`
  : `<span class="av ${size}" style="background:hsl(${hue(e?.name ?? '?')} 38% 44%)">${esc((e?.name ?? '?')[0].toUpperCase())}</span>`;
const team = () => state.employees.filter((e) => !e.archived_at);
const mainAssistant = () => emp(state.settings.main_assistant);
const busyIds = () => new Set(state.tasks.filter((t) => t.status === 'working').map((t) => t.employee_id));
const live = (t) => !t.archived_at;
const asking = (t) => Boolean(t.asking) && !['working', 'queued'].includes(t.status);
const needsYou = (t) => asking(t) || (t.kind === 'task' && ['review', 'failed', 'stopped'].includes(t.status)) || (t.kind === 'chat' && t.status === 'failed');
// Everything waiting on you: requests for your OK first, then questions, finished work, and problems.
function inboxItems() {
  const ok = (state.approvals ?? []).map((a) => ({ kind: 'ok', key: `a${a.id}`, ap: a, taskId: a.taskId, who: a.employeeId }));
  const rest = state.tasks.filter((t) => live(t) && needsYou(t)).map((t) => ({ kind: asking(t) ? 'ask' : t.status, key: `t${t.id}`, t, taskId: t.id, who: t.employee_id }));
  return [...ok, ...rest];
}
const under = (id) => { // a chat or task, and every subtask handed out from it, however deep
  const ids = new Set([id]);
  for (let grew = true; grew;) { grew = false; for (const t of state.tasks) if (ids.has(t.parent_id) && !ids.has(t.id)) { ids.add(t.id); grew = true; } }
  return ids;
};
const KIND = { ok: ['ok', 'Needs your OK'], ask: ['ask', 'Asked you'], review: ['review', 'Ready to check'], failed: ['failed', 'Went wrong'], stopped: ['stopped', 'Stopped'] };

// ---------- where you are: #/chats, #/chat/12, #/new/3, #/inbox, #/live, #/team, #/more ----------
let view = {}, listTab = 'chats', query = '', lastTab = 'chats', cameFromTab = false;
const seenAsks = new Set(); // requests that already popped up
const TABS = ['chats', 'inbox', 'live', 'team', 'more'];
function route() {
  const [, name = 'chats', id] = location.hash.match(/^#\/(\w+)(?:\/(\d+))?/) ?? [];
  const next = { name, id: id ? Number(id) : null };
  const changed = next.name !== view.name || next.id !== view.id;
  if (TABS.includes(next.name)) lastTab = next.name;
  else if (changed) cameFromTab = [...TABS, 'project', 'archive'].includes(view.name) || (cameFromTab && ['chat', 'new'].includes(view.name)); // the back button returns to that list
  if (changed && next.name === 'project') { memoryOpen = false; memoryText = null; }
  view = next;
  document.body.classList.toggle('inchat', ['chat', 'new', 'newtask', 'newproject'].includes(view.name));
  if (changed) { closeDial(); closeSheet(); detail = null; ask = null; files = []; shown.delete($('#screen')); $('#screen').scrollTop = 0; mountDock(); }
  render();
  if (view.name === 'chat') loadDetail(true);
  if (changed && motion) { const m = motion; document.body.classList.remove(m); void document.body.offsetWidth; document.body.classList.add(m); setTimeout(() => document.body.classList.remove(m), 400); }
  motion = null;
}
let motion = null; // set just before a navigation that should rise from the bottom
const go = (hash) => { location.hash = hash; };

// ---------- drawing the frame ----------
function render() {
  if (!state) return;
  const inbox = inboxItems().length, working = state.tasks.filter((t) => live(t) && t.status === 'working').length;
  const tab = view.name === 'archive' ? 'more' : view.name;
  setHTML($('#tabs'), [['chats', 'Chats', 'chats'], ['inbox', 'Inbox', 'inbox', inbox], ['live', 'Live', 'live', working], ['team', 'Team', 'team'], ['more', 'More', 'more']]
    .map(([k, label, ic, n]) => `<a href="#/${k}" class="${tab === k || (k === 'chats' && !['inbox', 'live', 'team', 'more'].includes(tab)) ? 'on' : ''}" ${tab === k ? 'aria-current="page"' : ''}>
      ${icon(ic)}${label}${n ? `<span class="badge ${k === 'live' ? 'live' : ''}">${n > 99 ? '99+' : n}</span>` : ''}</a>`).join(''));

}
const bar = (html, lined) => { setHTML($('#bar'), html); $('#bar').classList.toggle('lined', !!lined); };

// ---------- Chats (and Tasks) ----------
// A chat or task in a list: who, what, when, and a marker while they work or when it needs you.
function taskRow(t) {

const mine = (t) => t.kind === 'chat' || ['me', 'schedule'].includes(t.created_by); // what you started (subtasks show inside them)
function renderChats() {
  bar(`<h1>${{ chats: 'Chats', tasks: 'Tasks', projects: 'Projects' }[listTab]}</h1>${listTab === 'projects' ? '' : `<button class="ib" data-act="search" aria-label="Search">${icon('search')}</button>`}`);
  const q = query.trim().toLowerCase();
  if (setHTML($('#screen'), `${showSearch && listTab !== 'projects' ? `<label class="search">${icon('search')}<input id="q" type="search" placeholder="Search chats and tasks" enterkeyhint="search" autocomplete="off"></label>` : ''}

    <div class="seg" role="tablist">${[['chats', 'Chats'], ['tasks', 'Tasks'], ['projects', 'Projects']].map(([k, label]) => `<button class="${listTab === k ? 'on' : ''}" data-list="${k}" role="tab">${label}</button>`).join('')}</div>
    <div id="clist"></div><div style="height:84px"></div>`) && $('#q')) $('#q').value = query;
  setHTML($('#pins'), liveHTML());
  if (listTab === 'projects') {
    const list = state.projects.filter((p) => !p.archived_at).map((p) => {
      const its = state.tasks.filter((t) => live(t) && t.project_id === p.id && mine(t));
      return { p, its, last: its.map((t) => t.updated_at).sort().pop() ?? p.created_at };
    }).sort((a, b) => b.last.localeCompare(a.last));
    return setHTML($('#clist'), list.length ? list.map(({ p, its, last }) => { const chats = its.filter((t) => t.kind === 'chat').length, tasks = its.length - chats, busy = its.some((t) => t.status === 'working');
      return `<a class="row" href="#/project/${p.id}"><span class="avwrap"><span class="av" style="background:${projColor(p)}">${esc(p.name[0].toUpperCase())}</span>${busy ? '<span class="busy"></span>' : ''}</span>
        <span class="main"><span class="top"><b>${esc(p.name)}</b><time>${short(last)}</time></span>
        <span class="line"><span>${chats} chat${chats === 1 ? '' : 's'} · ${tasks} task${tasks === 1 ? '' : 's'}${p.description ? ` · ${esc(plain(p.description))}` : ''}</span></span></span></a>`; }).join('')
      : '<div class="empty"><b>No projects yet</b>Make one on the desktop version; its chats and tasks show up here.</div>');
  }
  const list = state.tasks.filter((t) => live(t) && (listTab === 'chats' ? t.kind === 'chat' : t.kind === 'task' && mine(t)))
    .filter((t) => !q || `${t.title} ${t.last ?? ''} ${nameOf(t.employee_id)} ${proj(t.project_id)?.name ?? ''}`.toLowerCase().includes(q));
  setHTML($('#clist'), list.length ? list.map(taskRow).join('') : `<div class="empty"><b>${q ? 'Nothing found' : listTab === 'chats' ? 'No chats yet' : 'No tasks yet'}</b>${q ? '' : listTab === 'chats' ? 'Tap + to talk to your team.' : 'Tasks you hand out show up here.'}</div>`);
}
// The + menu's people: your pinned ones (the same as the desktop sidebar), your main assistant first.
const pinned = () => team().filter((e) => !e.hidden).sort((a, b) => (b.id === state.settings.main_assistant) - (a.id === state.settings.main_assistant) || a.name.localeCompare(b.name));
// Who is working right now, above your chats; the row is gone while nobody is. Tap someone to open what they're on.
function liveHTML() {
  const seen = new Set(), now = state.tasks.filter((t) => live(t) && t.status === 'working').sort((a, b) => b.updated_at.localeCompare(a.updated_at))
    .filter((t) => !seen.has(t.employee_id) && seen.add(t.employee_id)); // their newest piece of work
  return now.map((t) => { const e = emp(t.employee_id), n = (state.approvals ?? []).filter((a) => a.employeeId === e?.id).length;
    return `<a class="pin" href="#/chat/${t.id}" aria-label="${esc(e?.name ?? '')} is working on ${esc(t.title)}${n ? `, needs your OK` : ''}">
      <span class="ring busy">${av(e)}${n ? `<span class="need">${n}</span>` : ''}</span><small>${esc(e?.name ?? '')}</small></a>`; }).join('');
}
async function setPinned(id, on) {
  const e = emp(id);

      if (!who) throw new Error('Pick who to talk to.');
      const { id } = await api('POST', '/api/chats', { employee_id: who.id, message: text, attachments: paths, ...(newModel ? { model: newModel } : {}), ...(newEffort ? { effort: newEffort } : {}), plan: newPlan,
        ...(newProject && proj(newProject) ? { project_id: newProject } : {}) });
      ta.value = ''; files = []; newModel = newEffort = ''; newPlan = false;
      buzz();
      await refresh();
      return location.replace(`#/chat/${id}`);
    }
    await api('POST', `/api/tasks/${t.id}/messages`, { text, attachments: paths, interrupt: interrupt && ['working', 'queued'].includes(t.status) });
    ta.value = ''; files = []; interrupt = false;
    buzz();
    renderFiles(); sizeBox();
    await refresh(); await loadDetail();
    requestAnimationFrame(() => toBottom(true));
  } catch (err) { fail(err); }
  finally { if (view.name === 'chat' && detail) renderDock(detail); }
}

// Attaching: pick photos or files; each uploads straight away and shows as a chip.
function renderFiles() {
  const row = $('#attachRow');
  if (!row) return;
  row.hidden = !files.length;
  setHTML(row, files.map((f, i) => `<span class="chip">${icon('file')}<span>${esc(f.name)}</span><small>${f.busy ? 'uploading…' : sizeOf(f.size)}</small><button type="button" data-unattach="${i}" aria-label="Remove">${icon('x')}</button></span>`).join(''));
}
async function addFiles(list) {
  for (const file of list) {
    if (file.size > 25e6) { toast(`${file.name} is too big (25 MB at most).`); continue; }
    const f = { name: file.name, size: file.size, busy: true };
    files.push(f);
    renderFiles();
    try {
      const data = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(file); });
      Object.assign(f, await api('POST', '/api/uploads', { name: file.name, data }), { busy: false });
    } catch (err) { files = files.filter((x) => x !== f); fail(err); }
    renderFiles();
    renderDock(detail ?? {});
  }
}

  };
  visualViewport.addEventListener('resize', kb);
  visualViewport.addEventListener('scroll', kb);
}

// ---------- keeping up: often while someone works, gently otherwise, not at all in the background ----------
async function refresh() {
  try {
    state = await api('GET', '/api/state?lite=1');
    misses = 0;
    $('#offline').hidden = true;
    applyLook();
    render();
  } catch { if (++misses >= 3) $('#offline').hidden = false; }
}
let looked = '';
function applyLook() { // light or dark, and your accent colour, from Settings → Appearance
  const { mode = 'system', accent = '' } = state.settings.appearance ?? {}, key = `${mode}${accent}`;
  if (key === looked) return;
  looked = key;
  const root = document.documentElement;
  if (mode === 'system') delete root.dataset.theme; else root.dataset.theme = mode;
  if (/^#[0-9a-f]{6}$/i.test(accent)) root.style.setProperty('--accent', accent); else root.style.removeProperty('--accent');
}
async function loop() {
  if (!document.hidden) {
    await refresh();
    if (view.name === 'chat') {
      const t = state?.tasks.find((x) => x.id === view.id);
      if (t && (['working', 'queued'].includes(t.status) || t.updated_at !== detail?.updated_at || Date.now() - detailAt > 15000)) await loadDetail();
    }
  }
  const busy = state?.tasks.some((t) => ['working', 'queued'].includes(t.status)) || (state?.approvals ?? []).length;
  setTimeout(loop, document.hidden ? 20000 : busy ? 2000 : 5000); // often while someone works, gently otherwise
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh().then(() => view.name === 'chat' && loadDetail()); });
addEventListener('hashchange', route);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
refresh().then(() => { route(); loop(); });
</script>
